services:
  recorder:
    build: ./recorder
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      SEGMENT_SECONDS: ${SEGMENT_SECONDS:-300}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      MAX_STORAGE_GB: ${MAX_STORAGE_GB:-0}
      LOCAL_BUFFER_HOURS: ${LOCAL_BUFFER_HOURS:-24}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG: /config/rclone.conf
      MEDIAMTX_API: http://mediamtx:9997
      RCLONE_DRIVE_USE_TRASH: "false"
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ./rclone:/config   # berisi rclone.conf (tidak di-commit)
    # Tidak dipublikasikan ke host: hanya bisa diakses oleh service api.

  mediamtx:
    image: bluenviron/mediamtx:1.21.4
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    # Tidak dipublikasikan ke host.

  api:
    build: ./api
    restart: unless-stopped
    depends_on: [recorder, mediamtx]
    environment:
      RECORDER_URL: http://recorder:8081
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}  # hanya dipakai untuk membuat admin awal
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - api-state:/app/state   # users.json (daftar pengguna)
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"  # default hanya localhost; isi BIND_ADDR=0.0.0.0 untuk akses dari LAN

volumes:
  api-state:
